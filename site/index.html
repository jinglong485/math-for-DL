<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Course Progress</title>
<meta name="description" content="Automatically graded progress on the SVD and matrix-calculus courses.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%232f6fdb'/%3E%3Cpath d='M7 22l6-7 5 4 7-9' stroke='white' stroke-width='3' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>
:root {
  --bg: #f6f6f3; --surface: #ffffff; --surface-2: #f1f1ed; --text: #1c1e22; --muted: #687080;
  --border: #e3e3dd; --track: #e6e7e3; --pass: #1f9254; --fail: #d1453b; --todo-text: #8a909b;
  --warn-bg: #fff4e5; --warn-border: #f2c48d; --warn-text: #8a4b08;
  --svd: #2f6fdb; --matcalc: #c4511e; --link: #2459b8; --shadow: 0 1px 2px rgba(20,20,10,.04), 0 2px 12px rgba(20,20,10,.04);
  --radius: 14px; --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #101216; --surface: #171a20; --surface-2: #1d2128; --text: #e8eaee; --muted: #9aa2ae;
    --border: #2a2f38; --track: #2a2f38; --pass: #3fbf7a; --fail: #ef6a5f; --todo-text: #7d8592;
    --warn-bg: #2b2114; --warn-border: #6b4a1e; --warn-text: #f3c27e;
    --svd: #6d9cf0; --matcalc: #f08a55; --link: #8fb3f5; --shadow: none;
  }
}
:root[data-theme="dark"] {
  --bg: #101216; --surface: #171a20; --surface-2: #1d2128; --text: #e8eaee; --muted: #9aa2ae;
  --border: #2a2f38; --track: #2a2f38; --pass: #3fbf7a; --fail: #ef6a5f; --todo-text: #7d8592;
  --warn-bg: #2b2114; --warn-border: #6b4a1e; --warn-text: #f3c27e;
  --svd: #6d9cf0; --matcalc: #f08a55; --link: #8fb3f5; --shadow: none;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}
a { color: var(--link); text-decoration: none; }
a:hover { text-decoration: underline; }
.wrap { max-width: 1060px; margin: 0 auto; padding: 0 16px; }
header { padding: 36px 0 12px; }
.eyebrow { font-size: 13px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
h1 { font-size: 30px; line-height: 1.2; margin: 4px 0 8px; letter-spacing: -.01em; }
h2 { font-size: 18px; margin: 0 0 14px; }
.meta { color: var(--muted); font-size: 14px; margin: 0; }
.meta .sha { font-family: var(--mono); font-size: 13px; }
.meta .sep { margin: 0 6px; opacity: .6; }
.banner { margin-top: 16px; padding: 12px 14px; border-radius: 10px; background: var(--warn-bg);
  border: 1px solid var(--warn-border); color: var(--warn-text); font-size: 14px; }
section { margin: 22px 0; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
  box-shadow: var(--shadow); padding: 20px; min-width: 0; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px; }
@media (max-width: 820px) { .grid2 { grid-template-columns: minmax(0, 1fr); } }

/* course cards */
.course-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
.course-name { display: flex; align-items: center; gap: 9px; font-weight: 650; font-size: 16px; }
.dot { width: 10px; height: 10px; border-radius: 50%; flex: none; }
.course-sub { color: var(--muted); font-size: 13px; margin-top: 2px; }
.score { text-align: right; white-space: nowrap; }
.score b { font-size: 34px; line-height: 1; font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
.score span { color: var(--muted); font-size: 15px; }
.delta { display: inline-block; font-size: 12px; font-weight: 600; padding: 1px 7px; border-radius: 999px;
  font-variant-numeric: tabular-nums; margin-left: 6px; vertical-align: middle; }
.delta.up { color: var(--pass); background: color-mix(in srgb, var(--pass) 14%, transparent); }
.delta.down { color: var(--fail); background: color-mix(in srgb, var(--fail) 14%, transparent); }
.total-bar { height: 8px; border-radius: 999px; background: var(--track); overflow: hidden; margin: 14px 0 6px; }
.total-bar i { display: block; height: 100%; border-radius: 999px; }
.rows { margin-top: 14px; border-top: 1px solid var(--border); }
.row { display: grid; grid-template-columns: 34px minmax(0, 1fr) 118px; gap: 2px 10px; align-items: center;
  padding: 11px 0; border-bottom: 1px solid var(--border); }
.row:last-child { border-bottom: 0; padding-bottom: 0; }
.code { font-weight: 700; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.title { font-size: 14px; font-weight: 550; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pts { font-size: 14px; font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap; }
.pts small { color: var(--muted); }
.bar { grid-column: 2 / 3; display: flex; height: 6px; border-radius: 999px; overflow: hidden; background: var(--track); }
.bar .p { background: var(--pass); } .bar .f { background: var(--fail); }
.counts { grid-column: 2 / 4; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.counts .f { color: var(--fail); }
.status { grid-column: 3 / 4; grid-row: 2; font-size: 11px; font-weight: 650; text-transform: uppercase;
  letter-spacing: .04em; text-align: right; }
.status.done { color: var(--pass); } .status.prog { color: var(--text); } .status.none { color: var(--todo-text); }
.status.err { color: var(--fail); }
.errmsg { grid-column: 2 / 4; font-family: var(--mono); font-size: 12px; color: var(--fail); overflow-wrap: anywhere; }

/* chart */
.chart-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 8px; }
.legend { display: flex; gap: 16px; font-size: 13px; color: var(--muted); flex-wrap: wrap; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.chart-box { position: relative; margin-top: 8px; }
svg.chart { display: block; width: 100%; height: 240px; overflow: visible; }
svg.chart text { fill: var(--muted); font-size: 11px; font-family: inherit; }
svg.chart .grid line { stroke: var(--border); }
.tip { position: absolute; pointer-events: none; background: var(--surface); border: 1px solid var(--border);
  border-radius: 10px; padding: 8px 10px; font-size: 12px; box-shadow: 0 6px 24px rgba(0,0,0,.12);
  max-width: 260px; display: none; z-index: 2; }
.tip .t-msg { font-weight: 600; margin: 2px 0 4px; overflow-wrap: anywhere; }
.tip .t-row { display: flex; justify-content: space-between; gap: 14px; font-variant-numeric: tabular-nums; }
.note { color: var(--muted); font-size: 13px; margin: 10px 0 0; }

/* failures */
details { border-top: 1px solid var(--border); padding: 10px 0; }
details:first-of-type { border-top: 0; padding-top: 0; }
summary { cursor: pointer; font-weight: 600; font-size: 14px; list-style: none; display: flex; justify-content: space-between; gap: 10px; }
summary::-webkit-details-marker { display: none; }
summary::after { content: "Show"; color: var(--link); font-weight: 500; font-size: 13px; }
details[open] summary::after { content: "Hide"; }
.fail-item { padding: 8px 0 0; }
.fail-item .name { font-family: var(--mono); font-size: 12.5px; overflow-wrap: anywhere; }
.fail-item .msg { font-family: var(--mono); font-size: 12px; color: var(--fail); overflow-wrap: anywhere; margin-top: 2px; }
.okay { color: var(--pass); font-size: 14px; }
.nofail { font-weight: 600; font-size: 14px; padding: 10px 0; border-top: 1px solid var(--border); }
.nofail:first-of-type { border-top: 0; padding-top: 0; }

/* history table */
.table-wrap { overflow-x: auto; margin: 0 -4px; }
table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
th { text-align: left; font-weight: 600; color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .04em;
  padding: 0 8px 8px; border-bottom: 1px solid var(--border); white-space: nowrap; }
td { padding: 9px 8px; border-bottom: 1px solid var(--border); vertical-align: top; }
tr:last-child td { border-bottom: 0; }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
td.when { white-space: nowrap; color: var(--muted); }
td.msg { min-width: 160px; }
td .sha { font-family: var(--mono); font-size: 12px; }

/* materials */
.mat h3 { font-size: 15px; margin: 0 0 8px; display: flex; align-items: center; gap: 8px; }
.mat ul { margin: 0; padding: 0; list-style: none; }
.mat li { padding: 5px 0; font-size: 14px; }
.mat li small { color: var(--muted); }

.empty { text-align: center; padding: 36px 20px; }
.empty code, .help code { font-family: var(--mono); font-size: 13px; background: var(--surface-2); padding: 2px 6px; border-radius: 6px; }
footer { color: var(--muted); font-size: 13px; padding: 10px 0 40px; }
footer p { margin: 4px 0; }
footer code { font-family: var(--mono); font-size: 12px; }
.ok-text { color: var(--pass); } .warn-text { color: var(--warn-text); }
@media (max-width: 520px) {
  h1 { font-size: 25px; }
  .card { padding: 16px; }
  .score b { font-size: 28px; }
  svg.chart { height: 200px; }
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="eyebrow">Math for Deep Learning</div>
    <h1>Course progress</h1>
    <p class="meta" id="meta">Loading the latest results…</p>
    <div class="banner" id="banner" hidden></div>
  </header>
  <main id="main"></main>
  <footer id="footer"></footer>
</div>

<script>
"use strict";
const COLORS = { svd: "var(--svd)", matcalc: "var(--matcalc)" };
const $ = (sel) => document.querySelector(sel);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const fmt = (x) => (Math.round(x * 10) / 10).toFixed(1).replace(/\.0$/, "");
const colorOf = (id) => COLORS[id] || "var(--muted)";

function ago(iso) {
  const s = (Date.now() - new Date(iso).getTime()) / 1000;
  if (!isFinite(s)) return "";
  if (s < 60) return "just now";
  const units = [[60, "minute"], [3600, "hour"], [86400, "day"], [604800, "week"], [2629800, "month"], [31557600, "year"]];
  let [d, u] = units[0];
  for (const [secs, name] of units) if (s >= secs) [d, u] = [secs, name];
  const n = Math.floor(s / d);
  return `${n} ${u}${n === 1 ? "" : "s"} ago`;
}
const dateShort = (iso) => new Date(iso).toLocaleDateString(undefined, { month: "short", day: "numeric" });
const dateTime = (iso) => new Date(iso).toLocaleString(undefined, { month: "short", day: "numeric", hour: "2-digit", minute: "2-digit" });

function deltaChip(now, before) {
  if (before == null) return "";
  const d = now - before;
  if (Math.abs(d) < 1e-9) return "";
  return `<span class="delta ${d > 0 ? "up" : "down"}">${d > 0 ? "+" : "−"}${fmt(Math.abs(d))}</span>`;
}

function statusOf(a) {
  if (a.error) return ["err", "Error"];
  if (a.tests && a.passed === a.tests) return ["done", "Complete"];
  if (a.passed > 0 || a.failed > 0) return ["prog", "In progress"];
  return ["none", "Not started"];
}

/* ------------------------------------------------------------ course cards */
function courseCard(c, prev) {
  const prevPts = prev?.points?.[c.id] || {};
  const prevTotal = prev?.totals?.[c.id];
  const done = c.assignments.filter((a) => statusOf(a)[0] === "done").length;
  const passed = c.assignments.reduce((s, a) => s + a.passed, 0);
  const tests = c.assignments.reduce((s, a) => s + a.tests, 0);
  const rows = c.assignments.map((a) => {
    const [cls, label] = statusOf(a);
    const n = Math.max(a.tests, 1);
    return `<div class="row">
      <div class="code">${esc(a.code)}</div>
      <div class="title" title="${esc(a.title)}">${esc(a.title)}</div>
      <div class="pts">${fmt(a.points)} <small>/ ${a.weight}</small>${deltaChip(a.points, prevPts[a.key])}</div>
      <div class="code"></div>
      <div class="bar" role="img" aria-label="${a.passed} of ${a.tests} tests passed">
        <i class="p" style="width:${(100 * a.passed) / n}%"></i><i class="f" style="width:${(100 * a.failed) / n}%"></i></div>
      <div class="status ${cls}">${label}</div>
      ${a.error
        ? `<div class="errmsg">${esc(a.error)}</div>`
        : `<div class="counts">${a.passed} passed · <span class="${a.failed ? "f" : ""}">${a.failed} failed</span> · ${a.todo} not done</div>`}
    </div>`;
  }).join("");
  return `<article class="card">
    <div class="course-head">
      <div>
        <div class="course-name"><span class="dot" style="background:${colorOf(c.id)}"></span>${esc(c.name)}</div>
        <div class="course-sub">${done} of ${c.assignments.length} assignments complete · ${passed} / ${tests} tests passing</div>
      </div>
      <div class="score"><b>${fmt(c.total)}</b><span> / ${c.max}</span>${deltaChip(c.total, prevTotal)}</div>
    </div>
    <div class="total-bar"><i style="width:${(100 * c.total) / (c.max || 100)}%;background:${colorOf(c.id)}"></i></div>
    <div class="rows">${rows}</div>
  </article>`;
}

/* ------------------------------------------------------------ chart */
function chartSection(history, courses) {
  const legend = courses.map((c) => `<span><span class="dot" style="background:${colorOf(c.id)}"></span>${esc(c.short)}</span>`).join("");
  const note = history.length < 2 ? `<p class="note">The chart fills in as you push more commits: one point per push.</p>` : "";
  return `<section class="card">
    <div class="chart-head"><h2>Progress over time</h2><div class="legend">${legend}</div></div>
    <div class="chart-box" id="chart-box"><svg class="chart" id="chart" role="img" aria-label="Score per commit for each course"></svg>
      <div class="tip" id="tip"></div></div>${note}
  </section>`;
}

function drawChart(history, courses) {
  const svg = $("#chart"), box = $("#chart-box"), tip = $("#tip");
  if (!svg) return;
  const W = Math.max(box.clientWidth, 280), H = svg.clientHeight || 240;
  const m = { l: 34, r: 12, t: 10, b: 26 };
  const iw = W - m.l - m.r, ih = H - m.t - m.b;
  const n = history.length;
  const x = (i) => m.l + (n <= 1 ? iw / 2 : (i * iw) / (n - 1));
  const y = (v) => m.t + ih - (v / 100) * ih;
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
  let g = `<g class="grid">`;
  for (const v of [0, 25, 50, 75, 100]) g += `<line x1="${m.l}" x2="${W - m.r}" y1="${y(v)}" y2="${y(v)}"></line><text x="${m.l - 8}" y="${y(v) + 4}" text-anchor="end">${v}</text>`;
  g += `</g>`;
  if (n) {
    const ticks = n === 1 ? [0] : [...new Set([0, Math.round((n - 1) / 2), n - 1])];
    for (const i of ticks) g += `<text x="${x(i)}" y="${H - 6}" text-anchor="${n === 1 ? "middle" : i === 0 ? "start" : i === n - 1 ? "end" : "middle"}">${dateShort(history[i].time)}</text>`;
  }
  for (const c of courses) {
    const pts = history.map((h, i) => [x(i), y(h.totals?.[c.id] ?? 0)]);
    if (pts.length > 1) g += `<polyline fill="none" stroke="${colorOf(c.id)}" stroke-width="2.25" stroke-linejoin="round" stroke-linecap="round" points="${pts.map((p) => p.join(",")).join(" ")}"></polyline>`;
    if (pts.length <= 40) for (const [px, py] of pts) g += `<circle cx="${px}" cy="${py}" r="3.2" fill="${colorOf(c.id)}"></circle>`;
  }
  g += `<line id="cursor" x1="0" x2="0" y1="${m.t}" y2="${m.t + ih}" stroke="var(--muted)" stroke-dasharray="3 3" visibility="hidden"></line>`;
  svg.innerHTML = g;
  const cursor = svg.querySelector("#cursor");
  const show = (clientX) => {
    if (!n) return;
    const r = svg.getBoundingClientRect();
    const px = ((clientX - r.left) / r.width) * W;
    const i = n === 1 ? 0 : Math.max(0, Math.min(n - 1, Math.round(((px - m.l) / iw) * (n - 1))));
    const h = history[i];
    cursor.setAttribute("x1", x(i)); cursor.setAttribute("x2", x(i)); cursor.setAttribute("visibility", "visible");
    tip.innerHTML = `<div>${esc(dateTime(h.time))}${h.sha ? ` · <span class="sha">${esc(h.sha.slice(0, 7))}</span>` : ""}</div>
      ${h.message ? `<div class="t-msg">${esc(h.message)}</div>` : ""}
      ${courses.map((c) => `<div class="t-row"><span><span class="dot" style="display:inline-block;margin-right:6px;background:${colorOf(c.id)}"></span>${esc(c.short)}</span><b>${fmt(h.totals?.[c.id] ?? 0)}</b></div>`).join("")}`;
    tip.style.display = "block";
    const left = (x(i) / W) * r.width;
    const tw = tip.offsetWidth;
    const pos = left > r.width / 2 ? left - tw - 12 : left + 12;     // beside the cursor line
    tip.style.left = Math.max(0, Math.min(r.width - tw, pos)) + "px";
    tip.style.top = "4px";
  };
  svg.onmousemove = (e) => show(e.clientX);
  svg.ontouchstart = svg.ontouchmove = (e) => show(e.touches[0].clientX);
  svg.onmouseleave = () => { tip.style.display = "none"; cursor.setAttribute("visibility", "hidden"); };
}

/* ------------------------------------------------------------ failures */
function failuresSection(courses) {
  const blocks = courses.map((c) => {
    const items = [
      ...c.collection_errors.map((e) => ({ name: e.file || "test collection", msg: e.message })),
      ...c.failures.map((f) => ({ name: `${f.assignment.toUpperCase()} · ${f.test}`, msg: f.message })),
    ];
    if (!items.length) return `<div class="nofail"><span class="dot" style="display:inline-block;margin-right:8px;background:${colorOf(c.id)}"></span>${esc(c.short)}: <span class="okay">no failing tests</span></div>`;
    return `<details ${items.length <= 6 ? "open" : ""}><summary><span><span class="dot" style="display:inline-block;margin-right:8px;background:${colorOf(c.id)}"></span>${esc(c.short)}: ${items.length} failing</span></summary>
      ${items.map((it) => `<div class="fail-item"><div class="name">${esc(it.name)}</div><div class="msg">${esc(it.msg)}</div></div>`).join("")}</details>`;
  }).join("");
  return `<section class="card"><h2>Failing tests</h2>
    <p class="note" style="margin:-8px 0 12px">Tests that ran and failed. Tests of functions you have not started yet count as “not done”, not as failures.</p>${blocks}</section>`;
}

/* ------------------------------------------------------------ history table */
function historySection(history, courses, repoUrl) {
  if (!history.length) return "";
  const rows = history.slice(-15).reverse().map((h, k, arr) => {
    const older = history[history.length - 2 - k];
    const sha = h.sha ? (repoUrl ? `<a class="sha" href="${esc(repoUrl)}/commit/${esc(h.sha)}">${esc(h.sha.slice(0, 7))}</a>` : `<span class="sha">${esc(h.sha.slice(0, 7))}</span>`) : "—";
    const cells = courses.map((c) => `<td class="num">${fmt(h.totals?.[c.id] ?? 0)}${older ? deltaChip(h.totals?.[c.id] ?? 0, older.totals?.[c.id]) : ""}</td>`).join("");
    const run = h.run_url ? ` · <a href="${esc(h.run_url)}">log</a>` : "";
    return `<tr><td class="when" title="${esc(h.time)}">${esc(dateTime(h.time))}</td><td>${sha}</td><td class="msg">${esc(h.message || "")}${run}</td>${cells}</tr>`;
  }).join("");
  return `<section class="card"><h2>Recent pushes</h2><div class="table-wrap"><table>
    <thead><tr><th>When</th><th>Commit</th><th>Message</th>${courses.map((c) => `<th class="num">${esc(c.short)}</th>`).join("")}</tr></thead>
    <tbody>${rows}</tbody></table></div></section>`;
}

/* ------------------------------------------------------------ materials */
function materialsSection(courses, repoUrl) {
  return `<section class="grid2">${courses.map((c) => `<div class="card mat">
    <h3><span class="dot" style="background:${colorOf(c.id)}"></span>${esc(c.name)}</h3>
    <ul>${c.books.map((b) => `<li><a href="${esc(b.file)}">${esc(b.label)}</a> <small>PDF</small></li>`).join("")}
      ${repoUrl ? `<li><a href="${esc(repoUrl)}/tree/HEAD/${esc(c.dir)}">Assignment code</a> <small>${esc(c.dir)}</small></li>` : ""}</ul>
  </div>`).join("")}</section>`;
}

/* ------------------------------------------------------------ page */
function render(scores, history) {
  const courses = scores.courses;
  const cm = scores.commit || {};
  const parts = [`Updated <span title="${esc(scores.generated)}">${esc(ago(scores.generated))}</span>`];
  if (cm.short) parts.push(`commit ${cm.url ? `<a class="sha" href="${esc(cm.url)}">${esc(cm.short)}</a>` : `<span class="sha">${esc(cm.short)}</span>`}${cm.message ? ` “${esc(cm.message)}”` : ""}`);
  if (scores.run_url) parts.push(`<a href="${esc(scores.run_url)}">test log</a>`);
  if (scores.repo_url) parts.push(`<a href="${esc(scores.repo_url)}">repository</a>`);
  $("#meta").innerHTML = parts.join(`<span class="sep">·</span>`);
  if (scores.regressed) { $("#banner").hidden = false; $("#banner").textContent = scores.message + " since the previous push."; }

  if (!history.length) history = [{ time: scores.generated, sha: cm.sha, message: cm.message, totals: Object.fromEntries(courses.map((c) => [c.id, c.total])) }];
  $("#main").innerHTML =
    `<section class="grid2">${courses.map((c) => courseCard(c, scores.previous)).join("")}</section>` +
    chartSection(history, courses) + failuresSection(courses) + historySection(history, courses, scores.repo_url) +
    materialsSection(courses, scores.repo_url);
  drawChart(history, courses);
  let t; window.addEventListener("resize", () => { clearTimeout(t); t = setTimeout(() => drawChart(history, courses), 120); });

  const fp = courses.map((c) => c.tests_modified
    ? `<span class="warn-text">⚠ The ${esc(c.short)} tests differ from the course release.</span>`
    : `<span class="ok-text">✓</span> ${esc(c.short)} tests unchanged from the course release`).join("<br>");
  $("#footer").innerHTML = `<p>${fp}</p><p>Scores are computed by <code>tools/collect_scores.py</code> on every push. Points per assignment = weight × passed tests ÷ all tests.</p>`;
}

function renderEmpty(reason) {
  $("#meta").textContent = "No results yet.";
  $("#main").innerHTML = `<section class="card empty help">
    <h2>No scores have been published yet</h2>
    <p>On GitHub, the <b>Grade and publish</b> workflow creates them on every push (see the <b>Actions</b> tab).</p>
    <p>To preview locally, run <code>python tools/collect_scores.py</code> from the repository root,<br>then <code>python -m http.server -d site 8000</code> and open <code>http://localhost:8000</code>.</p>
    <p class="note">${esc(reason)}</p></section>`;
}

async function load() {
  try {
    const res = await fetch("data/scores.json", { cache: "no-store" });
    if (!res.ok) throw new Error(`data/scores.json: HTTP ${res.status}`);
    const scores = await res.json();
    let history = [];
    try {
      const h = await fetch("data/history.json", { cache: "no-store" });
      if (h.ok) history = await h.json();
    } catch (e) { /* history is optional */ }
    render(scores, Array.isArray(history) ? history : []);
  } catch (e) {
    renderEmpty(e.message || String(e));
  }
}
load();
</script>
</body>
</html>
